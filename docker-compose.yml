services:
  # Primary Database with Vector Support
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voxmind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxmind_password}
      POSTGRES_DB: ${POSTGRES_DB:-voxmind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxmind_user} -d ${POSTGRES_DB:-voxmind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Queue & Cache Broker
  redis:
    image: redis:7-alpine
    container_name: voxmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Flask REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxmind-backend
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-voxmind_user}:${POSTGRES_PASSWORD:-voxmind_password}@postgres:5432/${POSTGRES_DB:-voxmind_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=cpu
    ports:
      - "5000:5000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Asynchronous Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxmind-celery
    command: celery -A app.jobs.celery_app.celery worker --loglevel=info
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-voxmind_user}:${POSTGRES_PASSWORD:-voxmind_password}@postgres:5432/${POSTGRES_DB:-voxmind_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voxmind-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
