# Stable project name preserves existing volumes after the public rename.
name: voxmind

services:
  # Primary Document Database
  mongo:
    image: mongo:7.0
    container_name: voxmind-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Queue & Cache Broker
  redis:
    image: redis:7-alpine
    container_name: voxmind-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Bundled local LLM server; no separate Ollama installation is needed.
  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_NO_CLOUD=true
      - NO_PROXY=localhost,127.0.0.1,::1,mongo,redis,backend,ai_service,ollama,${NO_PROXY:-}
      - no_proxy=localhost,127.0.0.1,::1,mongo,redis,backend,ai_service,ollama,${NO_PROXY:-}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Download once; the persistent volume makes subsequent starts quick.
  ollama_model:
    image: ollama/ollama:latest
    profiles: ["models"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - NO_PROXY=localhost,127.0.0.1,::1,mongo,redis,backend,ai_service,ollama,${NO_PROXY:-}
      - no_proxy=localhost,127.0.0.1,::1,mongo,redis,backend,ai_service,ollama,${NO_PROXY:-}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Python Local AI Microservice (faster-whisper, sentence-transformers, Ollama client)
  ai_service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: voxmind-ai-service
    environment:
      - AI_INTERNAL_SECRET=${AI_INTERNAL_SECRET:?Run npm start to generate the internal service key}
      - AUDIO_STORAGE_ROOT=/app/storage/uploads
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DEVICE=cpu
      - NO_PROXY=localhost,127.0.0.1,::1,mongo,redis,backend,ai_service,ollama,${NO_PROXY:-}
      - no_proxy=localhost,127.0.0.1,::1,mongo,redis,backend,ai_service,ollama,${NO_PROXY:-}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8000"
    volumes:
      - storage_data:/app/storage:ro
      - model_cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy '*' -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Node.js + Express + BullMQ Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxmind-backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/voxmind
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Run npm start to generate your local configuration}
      - AI_SERVICE_URL=http://ai_service:8000
      - AI_INTERNAL_SECRET=${AI_INTERNAL_SECRET:?Run npm start to generate the internal service key}
      - TRUST_PROXY=1
      - NO_PROXY=localhost,127.0.0.1,::1,mongo,redis,backend,ai_service,ollama,${NO_PROXY:-}
      - no_proxy=localhost,127.0.0.1,::1,mongo,redis,backend,ai_service,ollama,${NO_PROXY:-}
      - UPLOAD_DIR=/app/storage/uploads
      - CORS_ORIGIN=${FRONTEND_URL:-http://localhost:5173}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:-}
      - INTEGRATIONS_API_BASE_URL=${INTEGRATIONS_API_BASE_URL:-http://localhost:5000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID:-}
      - ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_AUTH_CLIENT_ID=${GOOGLE_AUTH_CLIENT_ID:-}
      - GOOGLE_AUTH_CLIENT_SECRET=${GOOGLE_AUTH_CLIENT_SECRET:-}
      - AUTH_API_BASE_URL=${AUTH_API_BASE_URL:-http://localhost:5000}
      - WEBEX_CLIENT_ID=${WEBEX_CLIENT_ID:-}
      - WEBEX_CLIENT_SECRET=${WEBEX_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frontend React Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voxmind-frontend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  storage_data:
  ollama_data:
  model_cache:
