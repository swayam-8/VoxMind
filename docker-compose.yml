services:
  # Primary Document Database
  mongo:
    image: mongo:7.0
    container_name: voxmind-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Queue & Cache Broker
  redis:
    image: redis:7-alpine
    container_name: voxmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Python Local AI Microservice (faster-whisper, sentence-transformers, Ollama client)
  ai_service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: voxmind-ai-service
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DEVICE=cpu
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Node.js + Express + BullMQ Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxmind-backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/voxmind
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-voxmind-jwt-super-secret-key-change-in-production}
      - AI_SERVICE_URL=http://ai_service:8000
      - UPLOAD_DIR=/app/storage/uploads
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frontend React Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voxmind-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  storage_data:
